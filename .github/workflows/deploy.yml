name: Deploy to Dev VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/kaylee-beauty-studio

            # Fetch và checkout code mới nhất từ nhánh dev
            git fetch origin main
            git reset --hard origin/main

            # npm install
            npm install

            # Reload ứng dụng với PM2
            pm2 reload kaylee-app || pm2 start npm --name "kaylee-app" -- start -- -p 30267
            pm2 save
            
      
        
          
