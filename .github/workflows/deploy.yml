name: Deploy to Dev VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Load môi trường NVM / Node / PM2
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:~/.nvm/versions/node/$(nvm current)/bin
          
            cd /var/www/kaylee-beauty-admin

            # Fetch và checkout code mới nhất từ nhánh dev
            git fetch origin main
            git reset --hard origin/main

            # npm install
            npm install

            # Reload ứng dụng với PM2
            pm2 reload kaylee-admin || pm2 start npm --name "kaylee-admin" -- run start
            pm2 save
            
      
        
          
